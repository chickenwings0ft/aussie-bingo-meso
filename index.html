<!doctype html>
<html lang="es" class="gate-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B6B45">
  <!-- Sin «bingo» en título ni vista previa: el juego es sorpresa hasta el 1 dic. -->
  <title>Meso Road Trip 2026</title>
  <meta name="description" content="Máximo Décimo Meridio, bienvenido al previaje del mejor viaje de tu vida.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aussie-bingo-meso.vercel.app/">
  <meta property="og:title" content="Máximo Décimo Meridio 🇦🇺">
  <meta property="og:description" content="Bienvenido al previaje del mejor viaje de tu vida. Meso Road Trip 2026.">
  <meta property="og:image" content="https://aussie-bingo-meso.vercel.app/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Meso y Luk con sombrero y una XXXX Gold">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B6B45'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='%23F5B700' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/prelaunch.css">
  <noscript><style>.gate-pending body > * { visibility: visible; }</style></noscript>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Intro previa al viaje: visible hasta la fecha de activación (ver PRELAUNCH en data.js) -->
  <div id="prelaunch" hidden></div>

  <div class="stripes stripes--top" aria-hidden="true"></div>

  <header class="wrap head">
    <p class="kicker" id="kicker"></p>
    <h1 class="title" id="title"></h1>
    <p class="route" id="route"></p>
    <p class="people" id="people"></p>

    <p class="referee" id="referee" hidden>
      <span>Modo árbitro: Meso solo ve la intro hasta que se active el juego.</span>
      <button class="referee__button" id="referee-exit" type="button">Ver la intro</button>
    </p>

    <details class="intro" id="intro">
      <summary class="intro__summary">
        <span id="intro-title"></span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <ol class="intro__steps" id="intro-steps"></ol>
      <button class="btn btn--dark intro__close" id="intro-close" type="button"></button>
    </details>
  </header>

  <div class="bar">
    <div class="wrap bar__inner">
      <div class="tabs" role="tablist" aria-label="Secciones">
        <button class="tab" role="tab" id="tab-card" aria-controls="panel-card" aria-selected="true" type="button">Cartón</button>
        <button class="tab" role="tab" id="tab-rules" aria-controls="panel-rules" aria-selected="false" tabindex="-1" type="button">Instrucciones</button>
      </div>
      <div class="progress">
        <div class="progress__track" id="progress" role="progressbar" aria-label="Casillas completadas" aria-valuemin="0">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
        <p class="progress__text">
          <span><b id="count-cells"></b> casillas</span>
          <span><b id="count-lines"></b> líneas</span>
        </p>
      </div>
    </div>
  </div>

  <main class="wrap">
    <noscript><p class="noscript">Esta web necesita JavaScript para funcionar.</p></noscript>

    <section class="panel" id="panel-card" role="tabpanel" aria-labelledby="tab-card" tabindex="0">
      <div class="grid" id="grid"></div>
    </section>

    <section class="panel" id="panel-rules" role="tabpanel" aria-labelledby="tab-rules" tabindex="0" hidden>
      <div class="rules-head">
        <p class="kicker" id="rules-kicker"></p>
        <h2 class="title title--small" id="rules-title"></h2>
        <p class="rules-note" id="rules-note"></p>
      </div>
      <div class="rules" id="rules"></div>
    </section>

    <section class="info" aria-label="Reglas y premios">
      <div>
        <h2 class="label" id="howto-title"></h2>
        <p id="howto"></p>
      </div>
      <div>
        <h2 class="label">Premios</h2>
        <ul class="prizes" id="prizes"></ul>
      </div>
    </section>

    <div class="actions">
      <a class="btn btn--outline" id="pdf-link" download>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Descargar PDF
      </a>
      <button class="btn btn--outline" id="sync-open" type="button" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="sync-open-label"></span>
      </button>
      <button class="btn btn--ghost" id="reset-open" type="button">Reiniciar cartón</button>
    </div>
  </main>

  <div class="stripes stripes--bottom" aria-hidden="true"></div>

  <!-- Ficha de una casilla -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet__body">
      <button class="sheet__close" id="sheet-close" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
      <p class="sheet__meta"><span class="chip" id="sheet-cat"></span><span id="sheet-stage"></span></p>
      <h2 class="sheet__title" id="sheet-title"></h2>
      <p class="sheet__note" id="sheet-note"></p>
      <p class="sheet__rule"><b id="sheet-rule-title"></b> <span id="sheet-rule"></span></p>
      <button class="btn btn--primary btn--block" id="sheet-toggle" type="button"></button>
    </div>
  </dialog>

  <!-- Reinicio con doble confirmación -->
  <dialog class="modal" id="reset-dialog" aria-labelledby="reset-title">
    <div class="modal__body">
      <h2 class="modal__title" id="reset-title"></h2>
      <p id="reset-text"></p>
      <div class="modal__actions">
        <button class="btn btn--outline" id="reset-cancel" type="button">Cancelar</button>
        <button class="btn btn--danger" id="reset-confirm" type="button"></button>
      </div>
    </div>
  </dialog>

  <!-- Sincronización entre móviles -->
  <dialog class="modal" id="sync-dialog" aria-labelledby="sync-title">
    <div class="modal__body">
      <h2 class="modal__title" id="sync-title"></h2>
      <p id="sync-text"></p>
      <input class="sync-link" id="sync-link" type="text" readonly aria-label="Enlace para el otro móvil" hidden>
      <p class="sync-status" id="sync-status" role="status"></p>
      <div class="modal__actions">
        <button class="btn btn--outline" id="sync-secondary" type="button"></button>
        <button class="btn btn--primary" id="sync-primary" type="button"></button>
        <button class="btn btn--ghost btn--block" id="sync-off" type="button" hidden>Desactivar en este móvil</button>
      </div>
    </div>
  </dialog>

  <!-- Cartón lleno -->
  <dialog class="modal modal--win" id="full-dialog" aria-labelledby="full-title">
    <div class="modal__body">
      <h2 class="modal__title modal__title--big" id="full-title"></h2>
      <p class="modal__lead" id="full-text"></p>
      <div class="modal__actions">
        <button class="btn btn--dark btn--block" id="full-close" type="button">¡Vamos!</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
